name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push server image
        working-directory: server
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_SERVER_REPOSITORY }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Build and push client image
        working-directory: client
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_CLIENT_REPOSITORY }}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy over SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["if [ -x /opt/todo-list/deploy.sh ]; then sudo /opt/todo-list/deploy.sh; else echo \"deploy.sh not found; running inline fallback deploy\"; cd /opt/todo-list; aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr-login.outputs.registry }}; export JWT_SECRET; JWT_SECRET=$(aws ssm get-parameter --name /todo-list/prod/JWT_SECRET --with-decryption --region ${{ vars.AWS_REGION }} --query \"Parameter.Value\" --output text); docker compose pull; docker compose up -d; docker image prune -f; fi"]' \
            --query "Command.CommandId" --output text)

          # Don't let a failed wait short-circuit the script - we still want
          # to print the invocation's actual output (including deploy.sh's
          # stdout/stderr on the instance) below, whether it succeeded or not.
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "::error::deploy.sh did not succeed on the instance (status: $STATUS) - see StandardErrorContent above"
            exit 1
          fi
